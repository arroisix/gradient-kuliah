name: Deploy to Firebase [DEV]
'on':
    push:
        branches:
            - dev
jobs:
    deploy:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v2
            - uses: FirebaseExtended/action-hosting-deploy@v0
              with:
                  repoToken: '${{ secrets.GITHUB_TOKEN }}'
                  firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_GRADIENT_WEB_INFRA }}'
                  channelId: live
                  target: dev
                  projectId: gradient-web-infra
