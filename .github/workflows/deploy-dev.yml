name: Deploy to Vercel Development

on:
    push:
        branches:
            - dev
    pull_request:
        branches:
            - dev

jobs:
    deploy:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v2

            - name: Install pnpm
              run: npm install -g pnpm

            - name: Install dependencies
              run: pnpm install

            - name: Check lint and format
              run: pnpm test-all

            - name: Deploy to Vercel
              uses: amondnet/vercel-action@v20
              with:
                  vercel-token: ${{ secrets.VERCEL_TOKEN }}
                  vercel-org-id: ${{ secrets.VERCEL_ORG_ID}} # Replace with your Vercel team ID
                  vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}

            - name: Extract deployment URL
              run: |
                  deployment_url=$(curl -s -X GET \
                    -H "Authorization: Bearer ${{ secrets.VERCEL_TOKEN }}" \
                    "https://api.vercel.com/v4/now/deployments?limit=1&projectId=${{ secrets.VERCEL_PROJECT_ID }}" | jq -r '.[0].url')
                  echo "::set-output name=url::$deployment_url"

            - name: Comment deployment URL
              run: |
                  echo "Preview URL: ${{ needs.deployment.outputs.url }}" # Use the output URL in a comment or any desired location
